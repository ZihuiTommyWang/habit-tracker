<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Habits</title>
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habits">
<style>
:root{
  --bg:#f4f5f2; --card:#ffffff; --text:#1c1e1a; --muted:#6b7266;
  --line:#e3e5df; --accent:#16a34a; --accent-soft:#e5f5ea;
  --bad:#dc2626; --bad-soft:#fdeaea; --btn:#eceee9; --btn-text:#3a3f36;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131511; --card:#1d201b; --text:#eef0ea; --muted:#9aa192;
    --line:#2b2f28; --accent:#4ade80; --accent-soft:#1c3325;
    --bad:#f87171; --bad-soft:#3a1f1f; --btn:#2a2e26; --btn-text:#d6d9d0;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
header{
  padding:calc(14px + env(safe-area-inset-top)) 18px 10px;
  max-width:560px; margin:0 auto;
}
h1{font-size:22px; margin:0 0 2px; letter-spacing:-.02em}
.sub{color:var(--muted); font-size:14px; margin:0}
main{max-width:560px; margin:0 auto; padding:0 14px}
.tabs{
  display:flex; gap:4px; background:var(--btn); border-radius:12px; padding:4px;
  margin:12px 0 14px;
}
.tabs button{
  flex:1; border:0; background:transparent; color:var(--muted);
  font:600 15px/1 inherit; font-family:inherit; padding:10px 0; border-radius:9px; cursor:pointer;
}
.tabs button.active{background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.summary{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:12px 16px; margin-bottom:12px; display:flex; align-items:center; gap:12px;
}
.summary .big{font-size:26px; font-weight:700; letter-spacing:-.02em}
.summary .lbl{color:var(--muted); font-size:13px}
.summary .barwrap{flex:1}
.bar{height:8px; background:var(--btn); border-radius:99px; overflow:hidden; margin-top:6px}
.bar i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .25s}
.habit{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:12px 12px 12px 14px; margin-bottom:8px;
  display:flex; align-items:center; gap:10px;
}
.habit.done{border-color:var(--accent); background:var(--accent-soft)}
.habit.over{border-color:var(--bad); background:var(--bad-soft)}
.hinfo{flex:1; min-width:0}
.hname{font-weight:600; font-size:15.5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.hname .check{color:var(--accent); font-weight:700}
.hmeta{color:var(--muted); font-size:13px; margin-top:2px; display:flex; gap:8px; align-items:center}
.streak{
  font-size:12px; font-weight:600; color:var(--accent);
  background:var(--accent-soft); border-radius:99px; padding:1px 8px; white-space:nowrap;
}
.habit.done .streak, .habit.over .streak{background:var(--card)}
.over .hmeta .used{color:var(--bad); font-weight:600}
.ctr{display:flex; align-items:center; gap:2px}
.ctr .count{min-width:52px; text-align:center; font-variant-numeric:tabular-nums; font-weight:700; font-size:16px}
.ctr .count small{color:var(--muted); font-weight:500}
.ctr button{
  width:44px; height:44px; border-radius:12px; border:1px solid var(--line);
  background:var(--btn); color:var(--btn-text); font-size:24px; font-weight:600;
  cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit;
}
.ctr button:active{transform:scale(.93)}
.ctr button.plus{background:var(--accent); border-color:var(--accent); color:#fff}
@media (prefers-color-scheme: dark){ .ctr button.plus{color:#0c130e} }
/* history */
.week{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; margin-bottom:10px;
}
.week h3{margin:0; font-size:15.5px; display:flex; justify-content:space-between; align-items:baseline}
.week h3 .score{color:var(--muted); font-weight:600; font-size:13.5px}
.week ul{list-style:none; margin:10px 0 0; padding:0}
.week li{
  display:flex; justify-content:space-between; font-size:14px; padding:3px 0; color:var(--muted);
}
.week li.met{color:var(--text)}
.week li .n{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:10px}
.week li .v{font-variant-numeric:tabular-nums; white-space:nowrap}
.week li.met .v{color:var(--accent); font-weight:600}
.empty{color:var(--muted); text-align:center; padding:40px 20px; font-size:15px}
/* edit */
.erow{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:10px 12px; margin-bottom:8px; display:flex; gap:8px; align-items:center;
}
.erow input[type=text]{
  flex:1; min-width:0; border:1px solid var(--line); background:var(--bg); color:var(--text);
  border-radius:9px; padding:9px 10px; font:15px inherit; font-family:inherit;
}
.erow select, .erow input[type=number]{
  border:1px solid var(--line); background:var(--bg); color:var(--text);
  border-radius:9px; padding:9px 6px; font:15px inherit; font-family:inherit;
}
.erow input[type=number]{width:52px; text-align:center}
.erow .del{
  width:38px; height:38px; flex:none; border:0; border-radius:9px; background:var(--bad-soft);
  color:var(--bad); font-size:17px; cursor:pointer; font-family:inherit;
}
.actions{display:flex; gap:8px; margin:14px 0 8px; flex-wrap:wrap}
.actions button, .actions label{
  border:1px solid var(--line); background:var(--card); color:var(--text);
  border-radius:11px; padding:11px 14px; font:600 14.5px inherit; font-family:inherit; cursor:pointer;
}
.actions .primary{background:var(--accent); border-color:var(--accent); color:#fff}
@media (prefers-color-scheme: dark){ .actions .primary{color:#0c130e} }
.hint{color:var(--muted); font-size:13px; margin:10px 2px 0}
</style>
</head>
<body>
<header>
  <h1>Weekly Habits</h1>
  <p class="sub" id="weekLabel"></p>
</header>
<main>
  <div class="tabs" role="tablist">
    <button id="tab-week" class="active" onclick="setView('week')">This Week</button>
    <button id="tab-history" onclick="setView('history')">History</button>
    <button id="tab-edit" onclick="setView('edit')">Edit</button>
  </div>
  <div id="view"></div>
</main>
<script>
'use strict';
const LS_KEY = 'habit-tracker-v1';
const SEED = [
  ['Gym', 3, 'at_least'],
  ['Run', 1, 'at_least'],
  ['Extra exercise day (beyond gym & run)', 1, 'at_least'],
  ['8k+ steps day', 5, 'at_least'],
  ['Healthy eating day', 5, 'at_least'],
  ['Unhealthy snacks', 3, 'at_most'],
  ['Bad sleep nights', 2, 'at_most'],
  ['Social event where I meet new people', 1, 'at_least'],
  ['Talk to a girl romantically', 1, 'at_least'],
  ['Call mom', 1, 'at_least'],
  ['Call dad', 1, 'at_least'],
  ['Call grandma', 1, 'at_least'],
  ['Side project session', 3, 'at_least'],
  ['Do something fun/cool', 1, 'at_least'],
];

// ---- week math (ISO week, Monday start) ----
function mondayOf(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - (x.getDay()+6)%7);
  return x;
}
function weekKey(d){
  const mon = mondayOf(d);
  const thu = new Date(mon); thu.setDate(mon.getDate()+3);
  const year = thu.getFullYear();
  const jan4 = new Date(year,0,4);
  const wk1 = mondayOf(jan4);
  const week = Math.round((thu - wk1)/(7*864e5)) + 1;
  return year + '-W' + String(week).padStart(2,'0');
}
function fmtMonday(d){
  return mondayOf(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}

// ---- state ----
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const s = JSON.parse(raw); if(s && s.habits) return s; }
  }catch(e){}
  return {
    habits: SEED.map(([name,target,kind],i)=>({id:'h'+(i+1), name, target, kind, order:i})),
    archived: [],
    weeks: {},
    firstWeek: weekKey(new Date()),
  };
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

function curWeek(){ return state.weeks[weekKey(new Date())] || {}; }
function countFor(wk, id){ return (state.weeks[wk] && state.weeks[wk][id]) || 0; }
function met(h, count){ return h.kind === 'at_most' ? count <= h.target : count >= h.target; }
function habitById(id){
  return state.habits.find(h=>h.id===id) || state.archived.find(h=>h.id===id);
}
function streak(h){
  let n = 0;
  const d = new Date();
  // current week counts once met; limit habits can't be "met" until the week is over
  if (h.kind === 'at_least' && met(h, countFor(weekKey(d), h.id))) n++;
  d.setDate(d.getDate()-7);
  while (weekKey(d) >= state.firstWeek){
    if (met(h, countFor(weekKey(d), h.id))) n++; else break;
    d.setDate(d.getDate()-7);
  }
  return n;
}

// ---- actions ----
function bump(id, delta){
  const wk = weekKey(new Date());
  if(!state.weeks[wk]) state.weeks[wk] = {};
  const next = Math.max(0, (state.weeks[wk][id]||0) + delta);
  state.weeks[wk][id] = next;
  save(); render();
  if (navigator.vibrate) navigator.vibrate(10);
}
function addHabit(){
  const id = 'h' + Date.now();
  state.habits.push({id, name:'New habit', target:1, kind:'at_least', order:state.habits.length});
  save(); render();
  const el = document.querySelector('[data-eid="'+id+'"] input[type=text]');
  if(el){ el.focus(); el.select(); }
}
function editHabit(id, field, value){
  const h = state.habits.find(h=>h.id===id); if(!h) return;
  if(field==='target'){ value = Math.max(0, parseInt(value,10)||0); }
  h[field] = value;
  save();
  if(field!=='name') render();
}
function delHabit(id){
  const h = state.habits.find(h=>h.id===id); if(!h) return;
  if(!confirm('Remove "'+h.name+'"? Past weeks keep its history.')) return;
  state.habits = state.habits.filter(x=>x.id!==id);
  state.archived.push(h);
  save(); render();
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'habit-tracker-backup-' + weekKey(new Date()) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const s = JSON.parse(r.result);
      if(!s || !Array.isArray(s.habits) || typeof s.weeks !== 'object') throw 0;
      if(!confirm('Replace all current data with this backup?')) return;
      s.archived = s.archived || [];
      s.firstWeek = s.firstWeek || weekKey(new Date());
      state = s; save(); render();
    }catch(e){ alert('That file is not a valid backup.'); }
  };
  r.readAsText(f);
  input.value = '';
}

// ---- rendering ----
let view = 'week';
function setView(v){
  view = v;
  for(const t of ['week','history','edit'])
    document.getElementById('tab-'+t).classList.toggle('active', t===v);
  render();
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  document.getElementById('weekLabel').textContent = 'Week of ' + fmtMonday(new Date());
  const el = document.getElementById('view');
  if(view==='week') el.innerHTML = renderWeek();
  else if(view==='history') el.innerHTML = renderHistory();
  else el.innerHTML = renderEdit();
}

function renderWeek(){
  const wk = curWeek();
  const habits = [...state.habits].sort((a,b)=>a.order-b.order);
  const onTrack = habits.filter(h=>met(h, wk[h.id]||0)).length;
  let html = `
    <div class="summary">
      <div><div class="big">${onTrack}/${habits.length}</div><div class="lbl">on track</div></div>
      <div class="barwrap"><div class="lbl">goals met this week</div>
        <div class="bar"><i style="width:${habits.length? Math.round(onTrack/habits.length*100):0}%"></i></div>
      </div>
    </div>`;
  for(const h of habits){
    const c = wk[h.id]||0;
    const isMet = met(h,c);
    const over = h.kind==='at_most' && c > h.target;
    const s = streak(h);
    const cls = over ? 'over' : (isMet && (h.kind==='at_least') ? 'done' : '');
    const metaTxt = h.kind==='at_most'
      ? `<span class="used">${c} of ${h.target} allowed</span>`
      : `goal ${h.target}×/week`;
    html += `
    <div class="habit ${cls}">
      <div class="hinfo">
        <div class="hname">${h.kind==='at_least' && isMet ? '<span class="check">✓</span>' : ''}${esc(h.name)}</div>
        <div class="hmeta">${metaTxt}${s>0?` <span class="streak">🔥 ${s} wk</span>`:''}</div>
      </div>
      <div class="ctr">
        <button aria-label="minus" onclick="bump('${h.id}',-1)">−</button>
        <div class="count">${c}<small>/${h.target}</small></div>
        <button aria-label="plus" class="plus" onclick="bump('${h.id}',1)">+</button>
      </div>
    </div>`;
  }
  return html;
}

function renderHistory(){
  const cur = weekKey(new Date());
  const keys = [];
  const d = mondayOf(new Date()); d.setDate(d.getDate()-7);
  for(let i=0; i<52; i++){
    const k = weekKey(d);
    if(k < state.firstWeek) break;
    keys.push([k, new Date(d)]);
    d.setDate(d.getDate()-7);
  }
  if(!keys.length) return `<div class="empty">No past weeks yet.<br>Your first finished week will show up here after Monday.</div>`;
  let html = '';
  for(const [k, mon] of keys){
    const wk = state.weeks[k] || {};
    const ids = new Set([...state.habits.map(h=>h.id), ...Object.keys(wk)]);
    const rows = [];
    let metN = 0, total = 0;
    for(const id of ids){
      const h = habitById(id); if(!h) continue;
      total++;
      const c = wk[id]||0;
      const ok = met(h,c);
      if(ok) metN++;
      rows.push({h, c, ok});
    }
    rows.sort((a,b)=>(a.h.order??99)-(b.h.order??99));
    html += `
    <div class="week">
      <h3>Week of ${mon.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
        <span class="score">${metN}/${total} met</span></h3>
      <ul>${rows.map(r=>`
        <li class="${r.ok?'met':''}">
          <span class="n">${esc(r.h.name)}</span>
          <span class="v">${r.c}/${r.h.target}${r.ok?' ✓':''}</span>
        </li>`).join('')}
      </ul>
    </div>`;
  }
  return html;
}

function renderEdit(){
  const habits = [...state.habits].sort((a,b)=>a.order-b.order);
  let html = habits.map(h=>`
    <div class="erow" data-eid="${h.id}">
      <input type="text" value="${esc(h.name)}" onchange="editHabit('${h.id}','name',this.value)">
      <select onchange="editHabit('${h.id}','kind',this.value)">
        <option value="at_least" ${h.kind==='at_least'?'selected':''}>at least</option>
        <option value="at_most" ${h.kind==='at_most'?'selected':''}>at most</option>
      </select>
      <input type="number" min="0" value="${h.target}" onchange="editHabit('${h.id}','target',this.value)">
      <button class="del" onclick="delHabit('${h.id}')" aria-label="delete">✕</button>
    </div>`).join('');
  html += `
    <div class="actions">
      <button class="primary" onclick="addHabit()">+ Add habit</button>
      <button onclick="exportJSON()">Export backup</button>
      <label>Import backup<input type="file" accept="application/json" hidden onchange="importJSON(this)"></label>
    </div>
    <p class="hint">Data is saved on this device. Export a backup to keep records or move data to another device.</p>`;
  return html;
}

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
// re-render when returning to the app only if a new week has started
let renderedWeek = weekKey(new Date());
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && weekKey(new Date()) !== renderedWeek){
    renderedWeek = weekKey(new Date());
    render();
  }
});
</script>
</body>
</html>
